
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-toggle>
        <ion-button>
          <ion-icon slot="icon-only" name="menu"></ion-icon>
        </ion-button>
      </ion-menu-toggle>
      <ion-buttons slot="start">
        <img src="assets/img/devudimudra.png" height="50">
      </ion-buttons>
    </ion-buttons>
    <ion-title class="ion-text-center" style="font-size:19px;font-family: mandali;"><b>అంతిమ దైవగ్రంథములో<br>జ్ఞాన వాక్యములు</b></ion-title>
    <ion-buttons slot="end">
        <img src="assets/img/kiss.png" height="50">
      </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid style="font-family:mandali" [style.background-color]='this.globaldata.bgColor' [style.color]='this.globaldata.fontColor' [ngStyle]="{'font-size':this.globaldata.fontSize+'px'}">
      <ion-row>
        <ion-col class="ion-text-center" >
          @if(this.globaldata.currentTatvam>0){
            <span class="align-icon" style="font-size:30px;"  (click)="this.globaldata.currentTatvam=this.globaldata.currentTatvam-1" >☜</span>
            &nbsp;
          }
            <b><span style="font-size:20px;font-family: mandali;"> జ్ఞాన వాక్య వివరము</span></b>&nbsp;
            <ion-icon name="settings-outline" (click)="presentModal()" class="align-icon"></ion-icon>
            @if(this.globaldata.currentTatvam<116){
              &nbsp;
              <span class="align-icon" style="font-size:30px;"   (click)="this.globaldata.currentTatvam=this.globaldata.currentTatvam+1" >☞</span>
            }
        </ion-col>
      </ion-row>
    <ion-row>
      <ion-col style="font-family:potti-sriramulu">
        <b><span  [innerHTML]="globaldata.tatvalu[globaldata.currentTatvam].sura | safe:'html'"> </span></b>
      </ion-col>
    </ion-row>
      <ion-row>
        <ion-col>
          <span [innerHTML]="globaldata.tatvalu[globaldata.currentTatvam].explanation | safe:'html'"> </span>
        </ion-col>
      </ion-row>
    @if(this.globaldata.currentTatvam<116){
      <ion-row>
        <ion-col class="ion-text-right" >
            <span class="align-icon" style="font-size:30px;margin-right:8px;"
            (click)="goToTop()" >☞</span>
        </ion-col>
      </ion-row>
    }
  </ion-grid>
</ion-content>
